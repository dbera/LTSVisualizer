name: Build offline HTML release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the manual test build"
        required: false
        default: "manual"

permissions:
  contents: write

concurrency:
  group: offline-html-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-offline:
    name: Build offline HTML
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build offline HTML
        run: npm run build:offline

      - name: Prepare release file
        run: mv dist-offline/index.html dist-offline/LTSVisualizer.html

      - name: Generate SHA-256 checksum
        run: |
          cd dist-offline
          sha256sum LTSVisualizer.html > SHA256SUMS.txt

      - name: Verify release contents
        run: |
          find dist-offline -maxdepth 1 -type f -printf "%f\n"
          test -f dist-offline/LTSVisualizer.html
          test -f dist-offline/SHA256SUMS.txt
          test "$(find dist-offline -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LTSVisualizer-offline-${{ github.event.inputs.version || github.ref_name }}
          path: |
            frontend/dist-offline/LTSVisualizer.html
            frontend/dist-offline/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist-offline/LTSVisualizer.html \
            dist-offline/SHA256SUMS.txt \
            --title "LTSVisualizer ${{ github.ref_name }}" \
            --generate-notes
