name: Continuous integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Compile backend source
        run: python -m compileall -q backend/app backend/tests

      - name: Verify backend imports
        env:
          PYTHONPATH: backend
        run: |
          python -c "from app.main import app; from app.parser.puml_parser import parse_puml; print(app.title)"

      - name: Run backend tests
        env:
          PYTHONPATH: backend
        shell: bash
        run: |
          if find backend/tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            python -m pytest backend/tests
          else
            echo "No backend tests found yet; compile and import checks passed."
          fi

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
